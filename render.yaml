# Render Blueprint: API only (Docker). Flutter Web → Vercel (frontend/vercel.json).
# New → Blueprint → connect repo. Set secret env vars when prompted.

services:
  - type: web
    name: fuel-station-api
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: AUTO_CREATE_TABLES
        value: "true"
      - key: SEED_ON_STARTUP
        value: "true"
      - key: CORS_ORIGINS
        sync: false

# Render Blueprint: API (Docker) + Flutter Web (static).
# New → Blueprint → connect repo. Set secret env vars in the dashboard when prompted.
#
# If Git root is the monorepo folder, paths below are correct.
# Adjust rootDir / dockerContext if your repo layout differs.

services:
  - type: web
    name: fuel-station-api
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: AUTO_CREATE_TABLES
        value: "true"
      - key: SEED_ON_STARTUP
        value: "true"
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: fuel-station-web
    runtime: static
    rootDir: frontend
    buildCommand: bash scripts/render_build.sh
    staticPublishPath: build/web
    envVars:
      - key: API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
